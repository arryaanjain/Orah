name: Deploy React Frontend

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies & Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api-erp.krescoindia.com/api' }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL || 'https://api-erp.krescoindia.com' }}
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy Compiled dist to Server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'frontend/dist/*'
          target: '/var/www/krescoindia.com/production/Orah/frontend/dist'
          strip_components: 2
          rm: true

      - name: Set Server File Permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo chown -R www-data:www-data /var/www/krescoindia.com/production/Orah/frontend/dist
            sudo chmod -R 755 /var/www/krescoindia.com/production/Orah/frontend/dist
