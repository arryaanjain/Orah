name: Deploy Laravel Backend

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Laravel API to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, ctype, json, bcmath, openssl, tokenizer, xml
          coverage: none

      - name: Deploy to Server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'backend/'
          target: '/var/www/krescoindia.com/production/Orah'
          rm: false

      - name: Execute Post-Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/krescoindia.com/production/Orah/backend
            
            # Remove stale bootstrap cache files from dev
            rm -f bootstrap/cache/packages.php bootstrap/cache/services.php bootstrap/cache/config.php bootstrap/cache/routes-v7.php
            
            # Run Composer & Laravel optimization commands
            composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs
            php artisan config:clear
            php artisan package:discover
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            
            # Reload PHP FPM service (using non-interactive sudo fallback)
            sudo -n systemctl reload php8.5-fpm || sudo -n systemctl reload php-fpm || true
